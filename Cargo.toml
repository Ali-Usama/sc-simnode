[workspace]
resolver = "2"
members = [
    "simnode",
    "runtime-api",
#    "tests",

     # parachain
#    "examples/parachain/node",
#    "examples/parachain/runtime",

     # aura
#     "examples/aura/node",
#     "examples/aura/runtime",

      # babe
#     "examples/babe/node",
#     "examples/babe/runtime",
#     "examples/babe/rpc",
]

[workspace.dependencies]
codec = { version = "3.6.12", package = "parity-scale-codec", default-features = false }
scale-info = { version = "2.11.1", default-features = false, features = ["derive"] }
jsonrpsee = "0.24.3"
#try-runtime-cli = "0.41.0"
polkadot-sdk = { version = "0.7.0", default-features = false }

# crates which cannot be used from polkadot-sdk
sp-core = { version = "34.0.0", default-features = false }
sp-runtime-interface = { version = "28.0.0", default-features = false }
cumulus-pallet-parachain-system = { version = "0.17.0", default-features = false }
substrate-wasm-builder = { version = "24.0.1",  default-features = false }
sc-service = { version = "0.46.0" }
sc-tracing = { version = "37.0.1" }

# local crates
simnode-runtime-api = { path = "./runtime-api", version = "16.0.0", default-features = false }
sc-simnode = { path = "./simnode", version = "16.0.0" }
